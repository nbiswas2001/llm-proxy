# llm-proxy configuration.
# Copy to config.toml and fill in your keys, then run: llm-proxy
#
# One provider serves each run. `llm-proxy --provider <name>` picks it; without
# that flag the one marked default = true is used. Only that provider is touched -
# the others are ignored entirely, and may even reference an API key you have not
# set yet. Two providers marked default is a startup error naming them.

[server]
host = "0.0.0.0"           # use "127.0.0.1" to accept local clients only
port = 8600
request_timeout_secs = 600 # whole upstream request, including a long stream
connect_timeout_secs = 15
max_body_mb = 64
# Every request and its response is appended to <log_dir>/llm-proxy-YYYY-MM-DD.log,
# a new file each day. Relative to this file; "" turns the transcript off.
log_dir = "logs"
# Keys clients must send as `Authorization: Bearer <key>`.
# Leave empty (or omit) to accept any client - fine for 127.0.0.1 only.
api_keys = []

[providers.deepseek]
default = true
api = "openai"
base_url = "https://api.deepseek.com/v1"
# Either a literal key, or "${ENV_VAR}" / "env:ENV_VAR" to read it from the environment
# or from the .env file beside this config (see .env.example).
api_key = "${DEEPSEEK_API_KEY}"

# A local server needs no key at all. Start llama.cpp with e.g.
#   llama-server -m model.gguf --port 8503
[providers.llamacpp]
default = false
api = "openai"
base_url = "http://127.0.0.1:8503/v1"

# Claude - run it with `llm-proxy --provider claude`.
# `api = "anthropic"` switches the wire protocol: the key goes upstream as
# `x-api-key` rather than a bearer token, and `anthropic-version` is filled in when
# the caller does not send one. Bodies are still forwarded byte for byte, so while
# this provider is active the proxy speaks Anthropic's Messages API (POST /v1/messages)
# and clients must too - an OpenAI-shaped request will be rejected by Anthropic, not
# translated here.
[providers.claude]
default = false
api = "anthropic"
base_url = "https://api.anthropic.com/v1"
api_key = "${ANTHROPIC_API_KEY}"

# Some providers want extra headers.
[providers.openrouter]
default = false
api = "openai"
base_url = "https://openrouter.ai/api/v1"
api_key = "${OPENROUTER_API_KEY}"

[providers.openrouter.headers]
"HTTP-Referer" = "http://localhost:8600"
"X-Title" = "llm-proxy"

# `llm-proxy --balance` prints the credit left on the provider that run selected
# (the default one, or whatever --provider named) and exits.
# DeepSeek and OpenRouter are built in; a balance API is not part of the OpenAI
# protocol, so for any other provider that offers one, name its endpoint here.
# The provider's key and headers are attached, and the JSON that comes back is
# printed as-is - nothing is assumed about its shape.
# [providers.someone.balance]
# url = "https://api.example.com/account/credits"

# Model names are passed through to the chosen provider exactly as the client
# sends them, so ask for whatever that provider serves - the proxy neither
# renames models nor keeps a list of them.
